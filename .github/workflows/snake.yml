
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ShivanshDwivedi2005
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#FF6B00
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FFD700

      - name: Publish snakes to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
